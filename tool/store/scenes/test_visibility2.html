<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../kit/base.css"></head>
<body style="background:#222;width:1768px;height:960px"><div id="row" style="display:flex;gap:20px;padding:20px"></div>
<script type="module">
import { loadIcons, fontsReady, imagesReady } from '../kit/core.js';
import { Phone, PHONE_ICONS } from '../kit/phone.js';
import { M3_ICONS } from '../kit/m3.js';
import { visibilityScreenFull, APPEARANCE2_ICONS } from '../kit/appearance2.js';
import { keyboard, SYSTEM_ICONS } from '../kit/system.js';
const q = new URLSearchParams(location.search);
const SETS = {
  a: [{}, { scroll: 330 }, { scroll: 1100 }, { scroll: 1100, tab: 'hidden' }],
  b: [{ accessibility: false, hidden: [], media: 1, calls: 0.5 }, { keyboard: 'hide', lock: 1, scroll: 150 }, { motion: 'bounce', tileMs: 700, scroll: 380, motionScroll: 'auto' },
      { query: 'mu', focused: true, scroll: 1100 }],
  d: [{ hidden: [], accessibility: false }, { hidden: [], accessibility: false, scroll: 640 }, { hidden: [], accessibility: false, scroll: 1000 },
      { hidden: ['games', 'reader', 'video'], scroll: -60 }],
  e: [{ focused: true, scroll: 1300, ime: 314, kb: true }, { focused: true, query: 're', scroll: 1300, ime: 314, kb: true }, { tab: 'hidden', query: 'vi', scroll: 1300 }, { keyboard: 'move', motion: 'fade', tileMs: 2050, scroll: 380 }],
  c: [{ keyboard: 'stay', motionCard: 0.5, scroll: 200 }, { tab: 'hidden', hidden: [], scroll: 900 }, { scroll: 2000 }, { scroll: 820 }],
};
window.sceneReady = (async () => {
  await loadIcons([...new Set([...PHONE_ICONS, ...M3_ICONS, ...APPEARANCE2_ICONS, ...SYSTEM_ICONS])]); await fontsReady();
  const out = [];
  for (const o of SETS[q.get('set') || 'a']) {
    const p = new Phone({ wallpaper: null, radius: 30, darkIcons: true }); p.wall.style.display = 'none';
    const el = visibilityScreenFull(o);
    p.below.appendChild(el); document.getElementById('row').appendChild(p.el);
    if (o.kb) p.below.appendChild(keyboard({ dark: false }));
    const L = el.layout;
    out.push(JSON.stringify({ o, vt: L.viewportTop, vh: L.viewportH, max: L.maxScroll, pinAt: L.pinAt,
      c: Object.fromEntries(['row-media', 'row-calls', 'keyboard-move', 'motion-glide', 'keyboard-hide', 'keyboard-stay', 'row-lock', 'search', 'tab-all', 'app-browser', 'app-weather'].map((k) => [k, L.content[k]])),
      t: Object.fromEntries(['search', 'tab-all', 'tab-hidden'].map((k) => [k, L.targets[k]?.y])) }));
  }
  console.warn(out.join('\n'));
  await imagesReady();
  window.scene = { width: 1768, height: 960, duration: 0, seek() {} };
})();
</script></body></html>
