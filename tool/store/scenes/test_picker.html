<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../kit/base.css"></head>
<body style="background:#222;width:1752px;height:960px"><div id="row" style="display:flex;gap:20px;padding:20px"></div>
<script type="module">
import { loadIcons, fontsReady, imagesReady } from '../kit/core.js';
import { Phone, PHONE_ICONS } from '../kit/phone.js';
import { actionPicker, pickerLayout, ACTIONS_ICONS } from '../kit/actions.js';
window.sceneReady = (async () => {
  await loadIcons([...PHONE_ICONS, ...ACTIONS_ICONS]); await fontsReady();
  const q = new URLSearchParams(location.search);
  const sys = pickerLayout({ slot: 'swipeIn' }).groupScroll.system;
  const sets = {
    a: [
      { slot: 'swipeIn' },
      { slot: 'longPress', mode: 'regular' },
      { slot: 'swipeIn', scroll: sys },
      { slot: 'swipeUp', app: 'video' },
    ],
    b: [
      { slot: 'swipeUp', mode: 'regular' },
      { slot: 'swipeDown', scroll: 1400, side: 'left' },
      { slot: 'tap', query: 'vol', focused: true },
      { slot: 'tap', selected: 'launch-app:music', scroll: pickerLayout({ slot: 'tap', selected: 'launch-app:music' }).groupScroll.deck },
    ],
  };
  window.layouts = [];
  for (const o of sets[q.get('set') || 'a']) {
    const p = new Phone({ wallpaper: null, radius: 30, darkIcons: true }); p.wall.style.display = 'none';
    const el = actionPicker(o);
    window.layouts.push(el.layout);
    p.below.appendChild(el); document.getElementById('row').appendChild(p.el);
  }
  await imagesReady();
  window.scene = { width: 1752, height: 960, duration: 0, seek() {} };
})();
</script></body></html>
