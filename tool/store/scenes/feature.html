<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../kit/base.css"></head>
<body style="margin:0;width:1024px;height:500px"><div id="root" style="position:relative;width:1024px;height:500px;overflow:hidden"></div>
<script type="module">
// Google Play feature graphic, 1024 x 500, and the promo's YouTube thumbnail (v=yt, drawn at
// 1920 x 1080), on the light backdrop of the Bleed screenshots: the words on the left, and on the
// right the Quick slider in the Classic shape, 72 dp thick, in a dozen of its fills, in tilted
// columns that run off the top and bottom. Play uses the feature graphic as the promo video's
// cover, cropped to 16:9 (68 px off each side) with its play button over the middle, so both are
// laid out in that 16:9 frame, 500 units tall: the words in its left third, the sliders in its
// right third, the middle clear. The thumbnail is the same frame, drawn 2.16 times the size.
import { h, fontsReady, imagesReady } from '../kit/core.js';
import { QuickPanel, PRESETS, loadDrawables } from '../kit/quickpanel.js';
import { fillPanel } from '../kit/panelfills.js';
import '../kit/pictorialfills.js';
import { Backdrop } from '../kit/stage.js';

const q = new URLSearchParams(location.search);
const yt = q.get('v') === 'yt';
const W = yt ? 1920 : 1024, H = yt ? 1080 : 500;
const k = H / 500;                        // px per unit of the frame
const FW = 500 * 16 / 9;                  // the frame's width in units
const X0 = (W - FW * k) / 2;              // where it starts: 68 px in on the feature graphic, 0 on the thumbnail
const u = (n) => n * k;                   // a length in units, in px
const ux = (n) => X0 + n * k;             // an x in units, in px
const root = document.getElementById('root');
root.style.width = W + 'px'; root.style.height = H + 'px';
document.body.style.width = W + 'px'; document.body.style.height = H + 'px';

// The sliders, column by column from the left, each column top to bottom: a fill, the level it
// shows and its icon. (Clock: the fill's own cycle for the pictures, in s.)
const VOL = 'ic_vol_increase', SUN = 'ic_brightness_up';
const COLUMNS = [
  [[{ kind: 'shader', effect: 'mesh' }, 0.5, SUN], [{ kind: 'tide-up' }, 0.58, VOL, 2.6], [{ kind: 'sunrise' }, 0.66, SUN, 9]],
  [[{ kind: 'liquid' }, 0.7, VOL, 6], [{ kind: 'surge', look: 'curve' }, 0.64, VOL], [{ kind: 'cyberpunk' }, 0.5, SUN, 2.4], [{ kind: 'shader', effect: 'caustics' }, 0.6, VOL]],
  [[{ kind: 'waveform' }, 0.62, VOL, 2.4], [{ kind: 'shader', effect: 'aurora' }, 0.74, SUN], [{ kind: 'surge', look: 'flame' }, 0.56, VOL], [{ kind: 'silk' }, 0.68, SUN, 7]],
  [[{ kind: 'surge', look: 'honeycomb' }, 0.6, SUN], [{ kind: 'pixels', pattern: 'spectrum', columns: 4, gap: 0.18, roundness: 0.35, glow: 0.6, rest: 0.1 }, 0.66, VOL], [{ kind: 'galaxy' }, 0.6, SUN, 24]],
];
// Units a dp, the tilt, and where the columns' middle is; each column starts a little lower than
// the one before, so no two panels sit side by side.
const SC = 0.85, PW = 72, PH = 220, TILT = -24;
const PITCH_X = PW * SC + 20, PITCH_Y = PH * SC + 20;
const CX = 752, CY = 250, STAGGER = [-0.62, -0.18, -0.48, -0.02];

window.sceneReady = (async () => {
  const all = COLUMNS.flat();
  await loadDrawables([VOL, SUN]);
  await QuickPanel.shadersFor(all.map(([f]) => f));
  await fontsReady();
  const bd = new Backdrop(W, H, { light: true, seed: 8 });
  root.appendChild(bd.el);

  // The sliders, under a soft indigo shadow cast straight down.
  const shade = h(`<div style="position:absolute;inset:0;filter:drop-shadow(0 ${u(12)}px ${u(16)}px rgba(49,46,129,.26)) drop-shadow(0 ${u(3)}px ${u(5)}px rgba(49,46,129,.16))"></div>`);
  const tilt = h(`<div style="position:absolute;left:${ux(CX)}px;top:${u(CY)}px;width:0;height:0;transform:rotate(${TILT}deg)"></div>`);
  shade.appendChild(tilt);
  root.appendChild(shade);
  const draws = [];
  COLUMNS.forEach((col, j) => col.forEach(([fill, value, icon, cycle], i) => {
    const x = (j - (COLUMNS.length - 1) / 2) * PITCH_X - (PW * SC) / 2;
    const y = (i - 1 + STAGGER[j]) * PITCH_Y - (PH * SC) / 2;
    const host = h(`<div style="position:absolute;left:${u(x)}px;top:${u(y)}px;width:${PW}px;height:${PH}px;transform-origin:0 0;transform:scale(${u(SC)})"></div>`);
    tilt.appendChild(host);
    const p = fillPanel(host, { w: PW, h: PH, bar: PRESETS.classic, fill, icon, showValue: true, showIcon: true });
    draws.push((t) => p.draw({ value, t: 1.59 + t, fillTime: 12.5 + 1.7 * (i + j) + t, phase: (((3 + i + j) + t) / (cycle || 2)) % 1, arrival: 1 }));
  }));

  // The words, in the Bleed captions' colours: 32 units in from the frame's left edge, as large as
  // they can be with "brightness," still ending clear of the play button in the middle.
  root.appendChild(h(`<div style="position:absolute;left:${ux(32)}px;top:0;bottom:0;width:${u(340)}px;display:flex;flex-direction:column;justify-content:center">
      <div style="font:700 ${u(16)}px/1 'Plus Jakarta Sans';letter-spacing:.16em;text-transform:uppercase;color:#4F46E5">Gesture Volume</div>
      <div style="margin-top:${u(16)}px;font:800 ${u(60)}px/1 'Plus Jakarta Sans';letter-spacing:-.03em;color:#1E1B4B;white-space:nowrap">Volume &amp;<br>brightness,<br><span style="color:#4F46E5">your way</span></div></div>`));
  await imagesReady(root);
  window.scene = { width: W, height: H, duration: 0, seek(t) {
    bd.draw(4 + t);
    draws.forEach((d) => d(t));
  } };
})();
</script></body></html>
