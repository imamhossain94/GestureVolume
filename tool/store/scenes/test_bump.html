<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../kit/base.css"></head>
<body style="background:#222;width:2612px;height:960px"><div id="row" style="display:flex;gap:20px;padding:20px"></div>
<script type="module">
// The Button animation screen beside the app's code: the top of the page with the feature off (the
// water tile stretched over .bump-glass, outlined, to show where the caller draws), the Animation
// gallery with Fish jump chosen, Where your buttons are, Sound and Feel, the home screen with the new
// row, and the notes the screen shows when something is missing. ?set=b: other states to check.
import { loadIcons, fontsReady, imagesReady } from '../kit/core.js';
import { Phone, PHONE_ICONS } from '../kit/phone.js';
import { M3_ICONS } from '../kit/m3.js';
import { homeAppScreen, HOME_ICONS, SCREEN_ICONS } from '../kit/screens.js';
import { bumpSettingsScreen, bumpScrollFor, bumpGalleryScroll, bumpStageGlass, BUMP_ICONS } from '../kit/bumpsettings.js';
const q = new URLSearchParams(location.search);
const on = { enabled: true, style: 'fish' };
const SETS = {
  a: [
    { s: {}, glass: true },
    { s: { ...on, scroll: bumpScrollFor.bind(null, 'head-animation'), galleryScroll: bumpGalleryScroll('fish') } },
    { s: { ...on, scroll: bumpScrollFor.bind(null, 'head-place') } },
    { s: { ...on, scroll: bumpScrollFor.bind(null, 'head-sound') } },
    { home: { running: true, advanced: true, bump: true, scroll: 200 } },
    { s: { enabled: true, accessibility: false, running: false, withBump: 'both', sliderKeysOff: true } },
  ],
  b: [
    { s: { enableK: 0.5, scroll: -30 } },
    { s: { ...on, style: 'balloon', galleryScroll: 1246, scroll: bumpScrollFor.bind(null, 'gallery'), color: '#0B1A3A' } },
    { s: { ...on, placing: 'power', places: { power: { left: true, position: 0.5, lengthDp: 220 } }, dragging: 'position', scroll: bumpScrollFor.bind(null, 'head-place') } },
    { s: { ...on, accessibility: false, powerWake: true, sweep: 0.05, depth: 44, color: '#F2F2F5', accent: '#FF9F0A', showPercent: 0.5, scroll: bumpScrollFor.bind(null, 'head-power') } },
    { home: { running: true, advanced: false, expanded: true, scroll: 150 } },
    { s: { ...on, haptic: 'strong', holdMs: 4000, speed: 1.5, sound: false, scroll: 99999 } },
  ],
};
window.sceneReady = (async () => {
  await loadIcons([...new Set([...PHONE_ICONS, ...M3_ICONS, ...HOME_ICONS, ...SCREEN_ICONS, ...BUMP_ICONS])]); await fontsReady();
  const out = [];
  for (const o of SETS[q.get('set') || 'a']) {
    const p = new Phone({ wallpaper: null, radius: 30, darkIcons: true }); p.wall.style.display = 'none';
    let el;
    if (o.home) el = homeAppScreen(o.home);
    else {
      const s = { ...o.s };
      if (typeof s.scroll === 'function') s.scroll = s.scroll(s);
      el = bumpSettingsScreen(s);
      if (o.glass) {
        el.querySelector('.bump-glass').innerHTML = '<img src="../build/bump/tiles/water.png" style="position:absolute;inset:0;width:100%;height:100%">';
        el.querySelector('.bump-glass').style.outline = '1.5px dashed #E11D48';
        el.querySelector('.bump-glass').style.outlineOffset = '-1.5px';
      }
      const L = el.layout;
      out.push(JSON.stringify({ s: o.s.scroll ? { ...o.s, scroll: s.scroll } : o.s, vt: L.viewportTop, vh: L.viewportH, ch: L.contentH, max: L.maxScroll, at: L.scroll, headings: L.headings }));
    }
    p.below.appendChild(el); document.getElementById('row').appendChild(p.el);
  }
  out.push('glass ' + JSON.stringify(bumpStageGlass()));
  console.warn(out.join('\n'));
  await imagesReady();
  window.scene = { width: 2612, height: 960, duration: 0, seek() {} };
})();
</script></body></html>
