<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../kit/base.css"></head>
<body style="background:#222;width:452px;height:200px">
<script type="module">
import { loadIcons, fontsReady } from '../kit/core.js';
import { PHONE_ICONS } from '../kit/phone.js';
import { M3_ICONS } from '../kit/m3.js';
import * as A from '../kit/appearance2.js';
// Where things sit at scroll 0 (screen dp, status bar 32): the Appearance section headers for each
// open section, the preview bar on the stage per preset, and the Visibility group headings.
window.sceneReady = (async () => {
  await loadIcons([...new Set([...PHONE_ICONS, ...M3_ICONS, ...A.APPEARANCE2_ICONS])]); await fontsReady();
  const out = [];
  for (const preset of ['dock', 'classic']) for (const open of [null, 'content', 'size', 'colours', 'behaviour', 'position']) {
    const L = A.appearanceScreenFull({ preset, open }).layout;
    out.push(`${preset} open=${open}: ` + ['content', 'size', 'colours', 'behaviour', 'position'].map((s) => `${s} ${(L.content['section-' + s] + L.viewportTop).toFixed(1)}`).join(', ') + ` | maxScroll ${L.maxScroll}`);
  }
  for (const o of [{}, { accessibility: false, hidden: [] }, { keyboard: 'hide' }]) {
    const L = A.visibilityScreenFull(o).layout;
    out.push(`visibility ${JSON.stringify(o)}: ` + Object.entries(L.headings).map(([k, v]) => `${k} ${(v + L.viewportTop).toFixed(1)}`).join(', ') + ` | search ${(L.content.search + L.viewportTop).toFixed(1)} pinAt ${L.pinAt} maxScroll ${L.maxScroll.toFixed(1)}`);
  }
  console.warn(out.join('\n'));
  window.scene = { width: 452, height: 200, duration: 0, seek() {} };
})();
</script></body></html>
