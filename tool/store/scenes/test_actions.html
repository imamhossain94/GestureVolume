<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../kit/base.css"></head>
<body style="background:#222;width:1752px;height:960px"><div id="row" style="display:flex;gap:20px;padding:20px"></div>
<script type="module">
import { loadIcons, fontsReady, imagesReady } from '../kit/core.js';
import { Phone, PHONE_ICONS } from '../kit/phone.js';
import { actionsScreen, padGeometry, screenLayout, ACTIONS_ICONS } from '../kit/actions.js';
window.sceneReady = (async () => {
  await loadIcons([...PHONE_ICONS, ...ACTIONS_ICONS]); await fontsReady();
  const g = padGeometry({ mode: 'regular' });
  const bp = { x: g.barPoint.x - g.pad.x, y: g.barPoint.y - g.pad.y };
  const gd = padGeometry({ mode: 'advanced' });
  const bpd = { x: gd.barPoint.x - gd.pad.x, y: gd.barPoint.y - gd.pad.y };
  const sets = {
    a: [
      { mode: 'advanced' },
      { mode: 'regular', tried: { gesture: 'doubleTap' }, touch: { ...bp, alpha: 1 } },
      { mode: 'advanced', scroll: 330, tried: { gesture: 'swipeIn' } },
      { mode: 'advanced', scroll: 1371, doubleTapMs: 300 },
    ],
    b: [
      { mode: 'advanced', demo: { gesture: 'hold', hand: { press: 1, hold: 0.6 } } },
      { mode: 'advanced', demo: { gesture: 'tap', hand: { press: 0.3, ripple: 0.4 } }, tried: { gesture: 'tap', k: 0.5 } },
      { mode: 'advanced', side: 'left', scroll: 330, touch: { x: 60, y: 120, alpha: 0.6 }, tried: { gesture: 'swipeOut' } },
      { mode: 'regular', scroll: 330, sliderTarget: 'brightness', missing: ['writeSettings', 'accessibility'],
        slots: { swipeUp: 'increase-brightness', swipeIn: 'lock', swipeOut: 'launch-app:music' }, swipeStep: 10, appCount: 2 },
    ],
    c: [
      { mode: 'advanced', slots: { swipeUp: 'increase-brightness' }, missing: ['writeSettings'], dialog: 'brightness' },
      { mode: 'advanced', slots: { swipeIn: 'lock' }, dialog: 'accessibility' },
      { mode: 'advanced', slots: { swipeIn: 'lock' }, dialog: { kind: 'accessibility', scroll: 260 } },
      { mode: 'regular', slots: { doubleTap: 'dnd' }, dialog: { kind: 'dnd', k: 0.6 } },
    ],
  };
  const states = sets[new URLSearchParams(location.search).get('set') || 'a'];
  window.layouts = [];
  for (const o of states) {
    const p = new Phone({ wallpaper: null, radius: 30, darkIcons: true }); p.wall.style.display = 'none';
    const el = actionsScreen(o);
    window.layouts.push(screenLayout(el));
    p.below.appendChild(el); document.getElementById('row').appendChild(p.el);
  }
  await imagesReady();
  window.scene = { width: 1752, height: 960, duration: 0, seek() {} };
})();
</script></body></html>
